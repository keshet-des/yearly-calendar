<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח תכנון שנתי</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 20px;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 18px;
            color: #2c3e50;
        }

        .year-selector {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #555;
        }

        .year-selector select {
            font-size: 14px;
            padding: 2px 6px;
            border: 1px solid #3498db;
            border-radius: 4px;
            background: white;
            color: #2c3e50;
            cursor: pointer;
            font-weight: 600;
        }

        .calendar-wrapper {
            padding: 8px;
            overflow: auto;
            flex: 1;
            min-height: 0;
        }

        .calendar {
            display: grid;
            grid-template-columns: 56px repeat(37, minmax(28px, 1fr));
            grid-template-rows: auto repeat(12, 1fr);
            gap: 1px;
            background: #c0c7d0;
            border-radius: 6px;
            overflow: hidden;
            height: 100%;
        }

        .corner-cell {
            background: #2c3e50;
            padding: 3px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 9px;
        }

        .day-header {
            background: #34495e;
            color: #ecf0f1;
            padding: 3px 2px;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            user-select: none;
        }

        .day-header.shabbat { background: #1a252f; color: #f5c542; }
        .day-header.friday  { background: #253545; }
        .day-header.week-sep { border-right: 2px solid #1a252f; }

        .month-label {
            background: #3498db;
            color: white;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        .month-row-odd .month-label { background: #2980b9; }

        .day-cell {
            background: white;
            cursor: pointer;
            position: relative;
            text-align: right;
            font-size: 9px;
            font-weight: 400;
            color: #3B383D;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2px 3px;
            transition: background 0.12s, box-shadow 0.12s;
            user-select: none;
            overflow: hidden;
        }

        .day-cell:hover {
            background: #FFF1A9;
            z-index: 1;
        }

        .day-cell .type-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .type-dot.type-general { background: #3498db; }
        .type-dot.type-holiday { background: #e74c3c; }
        .type-dot.type-vacation { background: #45EDCC; }

        .day-cell.vacation-cell { background: #D8FEF7 !important; }

        .day-cell.today {
            background: #FFF1A9 !important;
            box-shadow: inset 0 0 0 2px #FFDD28;
            z-index: 1;
        }

        .day-cell.weekend { background: #F7F5F9; }

        .empty-cell { background: #E2DCE5; overflow: hidden; border: none; outline: none; box-shadow: none; border-width: 0; }
        .calendar .empty-cell { border: 0 !important; }

        .month-row-odd .day-cell { background: white; }
        .month-row-odd .empty-cell { background: #E2DCE5; border: none; }
        .month-row-odd .day-cell.weekend { background: #F7F5F9; }

        .week-sep { border-right: 2px solid #d0d7e0; }

        .content-preview {
            font-size: 12px;
            color: #000;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            white-space: normal;
            word-break: break-all;
            max-width: 100%;
            padding: 0 1px;
            margin-top: 1px;
            line-height: 1.2;
        }

        .type-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .type-chip {
            padding: 5px 14px;
            border-radius: 20px;
            border: 2px solid #e0e4e8;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            color: #555;
            transition: all 0.15s;
        }

        .type-chip:hover { border-color: #aaa; }

        .type-chip.active-general { border-color: #3498db; background: #ebf5fb; color: #2980b9; }
        .type-chip.active-holiday { border-color: #e74c3c; background: #fdedec; color: #c0392b; }
        .type-chip.active-vacation { border-color: #45EDCC; background: #D8FEF7; color: #1a9e7e; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-date {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .modal-weekday {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
        }

        .modal textarea {
            width: 100%;
            height: 150px;
            border: 2px solid #e0e4e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            direction: rtl;
            line-height: 1.6;
        }

        .modal textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 9px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            transition: background 0.15s, transform 0.1s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-save { background: #27ae60; color: white; }
        .btn-save:hover { background: #219a52; }

        .btn-cancel { background: #ecf0f1; color: #555; }
        .btn-cancel:hover { background: #dde4e6; }

        .btn-delete { background: #e74c3c; color: white; margin-right: auto; }
        .btn-delete:hover { background: #c0392b; }

        .bottom-sections {
            display: none;
        }

        .section-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .section-card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 16px;
        }

        .section-card textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #e0e4e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            direction: rtl;
            line-height: 1.6;
        }

        .section-card textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }
    </style>
</head>
<body>

<div class="app-header">
    <img src="logo.png" alt="logo" style="height:22px; width:auto;">
    <h1>לוח תכנון שנתי</h1>
    <span class="year-selector">| לשנת <select id="yearSelect"></select></span>
</div>

<div class="calendar-wrapper">
    <div class="calendar" id="calendar"></div>
</div>

<div class="bottom-sections">
    <div class="section-card">
        <h3>תכנית שנתית</h3>
        <textarea id="yearlyPlan" placeholder="מה התכניות לשנה הזו?"></textarea>
    </div>
    <div class="section-card">
        <h3>השנה אני...</h3>
        <textarea id="yearlyGoals" placeholder="השנה אני הולכת ל..."></textarea>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-weekday" id="modalWeekday"></div>
        <div class="type-chips" id="typeChips">
            <button class="type-chip" data-type="general">כללי</button>
            <button class="type-chip" data-type="holiday">חג</button>
            <button class="type-chip" data-type="vacation">חופשה</button>
        </div>
        <div class="date-range" id="dateRange" style="display:none; margin-bottom:12px;">
            <label style="font-size:13px; color:#555; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                מתאריך <input type="date" id="vacStart" style="padding:4px 8px; border:1px solid #ccc; border-radius:4px; font-family:inherit;">
                עד <input type="date" id="vacEnd" style="padding:4px 8px; border:1px solid #ccc; border-radius:4px; font-family:inherit;">
            </label>
        </div>
        <textarea id="modalText" placeholder="כתבי כאן..."></textarea>
        <div class="modal-buttons">
            <button class="btn btn-save" id="btnSave">שמור</button>
            <button class="btn btn-cancel" id="btnCancel">ביטול</button>
            <button class="btn btn-delete" id="btnDelete">מחק</button>
        </div>
    </div>
</div>

<script>
    var SUPABASE_URL = "https://agshutiyyoebbgtsjyfh.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnc2h1dGl5eW9lYmJndHNqeWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzUxODAsImV4cCI6MjA5MzExMTE4MH0.ieqA_oDeso09A_QwPjjUkX1CDMu6saMmpbd3I9K_cjs";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var MONTHS_HE = [
        "\u05d9\u05e0\u05d5\u05d0\u05e8", "\u05e4\u05d1\u05e8\u05d5\u05d0\u05e8", "\u05de\u05e8\u05e5", "\u05d0\u05e4\u05e8\u05d9\u05dc", "\u05de\u05d0\u05d9", "\u05d9\u05d5\u05e0\u05d9",
        "\u05d9\u05d5\u05dc\u05d9", "\u05d0\u05d5\u05d2\u05d5\u05e1\u05d8", "\u05e1\u05e4\u05d8\u05de\u05d1\u05e8", "\u05d0\u05d5\u05e7\u05d8\u05d5\u05d1\u05e8", "\u05e0\u05d5\u05d1\u05de\u05d1\u05e8", "\u05d3\u05e6\u05de\u05d1\u05e8"
    ];

    var DAYS_HE = ["\u05d0\u05f3", "\u05d1\u05f3", "\u05d2\u05f3", "\u05d3\u05f3", "\u05d4\u05f3", "\u05d5\u05f3", "\u05e9\u05f3"];

    var WEEKDAYS_FULL = [
        "\u05d9\u05d5\u05dd \u05e8\u05d0\u05e9\u05d5\u05df", "\u05d9\u05d5\u05dd \u05e9\u05e0\u05d9", "\u05d9\u05d5\u05dd \u05e9\u05dc\u05d9\u05e9\u05d9", "\u05d9\u05d5\u05dd \u05e8\u05d1\u05d9\u05e2\u05d9",
        "\u05d9\u05d5\u05dd \u05d7\u05de\u05d9\u05e9\u05d9", "\u05d9\u05d5\u05dd \u05e9\u05d9\u05e9\u05d9", "\u05e9\u05d1\u05ea"
    ];

    var TOTAL_COLS = 37;

    var currentYear = 2026;
    var calendarData = {};
    var currentEditKey = null;
    var currentEditMonth = null;
    var currentEditDay = null;
    var currentType = "general";

    function dataKey(month, day) { return month + "-" + day; }

    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }

    function getFirstDayOfWeek(year, month) {
        return new Date(year, month, 1).getDay();
    }

    function isToday(year, month, day) {
        var now = new Date();
        return now.getFullYear() === year && now.getMonth() === month && now.getDate() === day;
    }

    async function loadData(year) {
        var result = {};
        var { data, error } = await sb
            .from("calendar_entries")
            .select("month, day, content, type")
            .eq("year", year);

        if (data) {
            data.forEach(function(row) {
                result[dataKey(row.month, row.day)] = { text: row.content, type: row.type || "general" };
            });
        }
        return result;
    }

    async function saveEntryToDB(year, month, day, content, type) {
        await sb.from("calendar_entries").upsert({
            year: year,
            month: month,
            day: day,
            content: content,
            type: type,
            updated_at: new Date().toISOString()
        }, { onConflict: "year,month,day" });
    }

    async function deleteEntryFromDB(year, month, day) {
        await sb.from("calendar_entries")
            .delete()
            .eq("year", year)
            .eq("month", month)
            .eq("day", day);
    }

    async function loadNotesFromDB(year) {
        var { data } = await sb.from("calendar_notes")
            .select("note_type, content")
            .eq("year", year);
        var notes = {};
        if (data) data.forEach(function(r) { notes[r.note_type] = r.content; });
        return notes;
    }

    async function saveNoteToDB(year, noteType, content) {
        await sb.from("calendar_notes").upsert({
            year: year,
            note_type: noteType,
            content: content,
            updated_at: new Date().toISOString()
        }, { onConflict: "year,note_type" });
    }

    function buildYearSelector() {
        var select = document.getElementById("yearSelect");
        for (var y = 2024; y <= 2035; y++) {
            var opt = document.createElement("option");
            opt.value = y;
            opt.textContent = y;
            if (y === currentYear) opt.selected = true;
            select.appendChild(opt);
        }
        select.addEventListener("change", async function() {
            currentYear = parseInt(select.value);
            calendarData = await loadData(currentYear);
            renderCalendar();
            await loadBottomSections();
        });
    }

    function renderCalendar() {
        var grid = document.getElementById("calendar");
        grid.innerHTML = "";

        var corner = document.createElement("div");
        corner.className = "corner-cell";
        corner.textContent = "\u05d7\u05d5\u05d3\u05e9";
        grid.appendChild(corner);

        for (var i = 0; i < TOTAL_COLS; i++) {
            var hdr = document.createElement("div");
            hdr.className = "day-header";
            hdr.textContent = DAYS_HE[i % 7];
            if (i % 7 === 6) hdr.classList.add("shabbat");
            if (i % 7 === 5) hdr.classList.add("friday");
            if (i > 0 && i % 7 === 0) hdr.classList.add("week-sep");
            grid.appendChild(hdr);
        }

        for (var m = 0; m < 12; m++) {
            var isOdd = m % 2 === 1;
            var firstDay = getFirstDayOfWeek(currentYear, m);
            var days = getDaysInMonth(currentYear, m);

            var label = document.createElement("div");
            label.className = "month-label";
            if (isOdd) label.classList.add("month-row-odd");
            label.textContent = MONTHS_HE[m];
            grid.appendChild(label);

            for (var col = 0; col < TOTAL_COLS; col++) {
                var dayNum = col - firstDay + 1;
                var cell = document.createElement("div");
                var weekday = col % 7;

                if (col > 0 && col % 7 === 0) cell.classList.add("week-sep");

                if (dayNum >= 1 && dayNum <= days) {
                    cell.className = "day-cell";
                    if (isOdd) cell.classList.add("month-row-odd");
                    if (weekday === 5 || weekday === 6) cell.classList.add("weekend");

                    var numSpan = document.createElement("span");
                    numSpan.textContent = dayNum;
                    cell.appendChild(numSpan);

                    var key = dataKey(m, dayNum);
                    var entry = calendarData[key];
                    if (entry && entry.text) {
                        var entryType = entry.type || "general";
                        if (entryType === "vacation") cell.classList.add("vacation-cell");
                        var dot = document.createElement("div");
                        dot.className = "type-dot type-" + entryType;
                        cell.appendChild(dot);
                        var preview = document.createElement("div");
                        preview.className = "content-preview";
                        preview.textContent = entry.text;
                        cell.appendChild(preview);
                        cell.title = entry.text;
                    }

                    if (isToday(currentYear, m, dayNum)) {
                        cell.classList.add("today");
                    }

                    (function(mm, dd) {
                        cell.addEventListener("click", function() { openEditor(mm, dd); });
                    })(m, dayNum);
                } else {
                    cell.className = "empty-cell";
                    if (isOdd) cell.classList.add("month-row-odd");
                }

                grid.appendChild(cell);
            }
        }
    }

    function openEditor(month, day) {
        var key = dataKey(month, day);
        currentEditKey = key;
        currentEditMonth = month;
        currentEditDay = day;

        var dow = new Date(currentYear, month, day).getDay();

        document.getElementById("modalDate").textContent =
            day + " " + MONTHS_HE[month] + " " + currentYear;
        document.getElementById("modalWeekday").textContent = WEEKDAYS_FULL[dow];

        var entry = calendarData[key];
        var text = "";
        currentType = "general";

        if (entry) {
            text = entry.text || "";
            currentType = entry.type || "general";
        }

        document.getElementById("modalText").value = text;

        var dateStr = currentYear + "-" + String(month+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
        document.getElementById("vacStart").value = dateStr;
        document.getElementById("vacEnd").value = dateStr;

        updateChipsUI();

        document.getElementById("btnDelete").style.display = text ? "block" : "none";
        document.getElementById("modalOverlay").classList.add("active");
        setTimeout(function() { document.getElementById("modalText").focus(); }, 100);
    }

    function updateChipsUI() {
        document.querySelectorAll(".type-chip").forEach(function(chip) {
            chip.className = "type-chip";
            if (chip.dataset.type === currentType) {
                chip.classList.add("active-" + currentType);
            }
        });
        document.getElementById("dateRange").style.display = currentType === "vacation" ? "block" : "none";
    }

    function closeEditor() {
        document.getElementById("modalOverlay").classList.remove("active");
        currentEditKey = null;
    }

    async function saveEntry() {
        var text = document.getElementById("modalText").value.trim();

        if (currentType === "vacation" && text) {
            var startDate = new Date(document.getElementById("vacStart").value);
            var endDate = new Date(document.getElementById("vacEnd").value);
            if (isNaN(startDate) || isNaN(endDate) || endDate < startDate) {
                endDate = startDate;
            }
            var promises = [];
            var d = new Date(startDate);
            while (d <= endDate) {
                var m = d.getMonth();
                var dd = d.getDate();
                var key = dataKey(m, dd);
                calendarData[key] = { text: text, type: "vacation" };
                promises.push(saveEntryToDB(d.getFullYear(), m, dd, text, "vacation"));
                d.setDate(d.getDate() + 1);
            }
            await Promise.all(promises);
        } else if (text) {
            calendarData[currentEditKey] = { text: text, type: currentType };
            await saveEntryToDB(currentYear, currentEditMonth, currentEditDay, text, currentType);
        } else {
            delete calendarData[currentEditKey];
            await deleteEntryFromDB(currentYear, currentEditMonth, currentEditDay);
        }
        closeEditor();
        renderCalendar();
    }

    async function deleteEntry() {
        delete calendarData[currentEditKey];
        await deleteEntryFromDB(currentYear, currentEditMonth, currentEditDay);
        closeEditor();
        renderCalendar();
    }

    async function loadBottomSections() {
        var notes = await loadNotesFromDB(currentYear);
        document.getElementById("yearlyPlan").value = notes["plan"] || "";
        document.getElementById("yearlyGoals").value = notes["goals"] || "";
    }

    var noteTimer = null;
    function setupBottomSections() {
        document.getElementById("yearlyPlan").addEventListener("input", function(e) {
            clearTimeout(noteTimer);
            noteTimer = setTimeout(function() { saveNoteToDB(currentYear, "plan", e.target.value); }, 500);
        });
        document.getElementById("yearlyGoals").addEventListener("input", function(e) {
            clearTimeout(noteTimer);
            noteTimer = setTimeout(function() { saveNoteToDB(currentYear, "goals", e.target.value); }, 500);
        });
    }

    document.getElementById("btnSave").addEventListener("click", saveEntry);
    document.getElementById("btnCancel").addEventListener("click", closeEditor);
    document.getElementById("btnDelete").addEventListener("click", deleteEntry);

    document.querySelectorAll(".type-chip").forEach(function(chip) {
        chip.addEventListener("click", function() {
            currentType = chip.dataset.type;
            updateChipsUI();
        });
    });

    document.getElementById("modalOverlay").addEventListener("click", function(e) {
        if (e.target === e.currentTarget) closeEditor();
    });

    document.addEventListener("keydown", function(e) {
        if (!document.getElementById("modalOverlay").classList.contains("active")) return;
        if (e.key === "Escape") closeEditor();
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveEntry();
    });

    buildYearSelector();
    setupBottomSections();

    (async function() {
        calendarData = await loadData(currentYear);
        renderCalendar();
        await loadBottomSections();
    })();
</script>

</body>
</html>
