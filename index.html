<body>

<div class="app-header">
    <div class="header-center">
        <h1>לוח תכנון שנתי לשנת</h1>
        <select id="yearSelect"></select>
    </div>
    <img src="logo.png" alt="logo" class="logo">
</div>

<div class="calendar-wrapper">
    <div class="calendar" id="calendar"></div>
</div>
<div class="cell-tooltip" id="cellTooltip"></div>

<div class="bottom-sections">
    <div class="section-card">
        <h3>תכנית שנתית</h3>
        <textarea id="yearlyPlan" placeholder="מה התכניות לשנה הזו?"></textarea>
    </div>
    <div class="section-card">

</div>

        <div class="entries-list" id="entriesList"></div>
        <div class="new-entry-form" id="newEntryForm">
            <div class="type-selector" id="newTypeSelector">
                <button class="type-option active" data-type="general">אירוע</button>
                <button class="type-option" data-type="vacation">חופש</button>
            </div>
            <textarea id="newEntryText" placeholder="תאור ופרטים..."></textarea>
            <div class="form-actions">
                <button class="form-btn form-btn-save" id="newEntrySave">הוסף</button>
                <button class="form-btn form-btn-cancel" id="newEntryCancel">ביטול</button>
            </div>
        </div>
        <button class="add-entry-btn" id="addEntryBtn">+ הוסף תוכן</button>
        <div class="modal-buttons">
            <button class="btn btn-cancel" id="btnCancel">סגור</button>
        </div>
    </div>
</div>

    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var MONTHS_HE_FULL = [
        "\u05d9\u05e0\u05d5\u05d0\u05e8", "\u05e4\u05d1\u05e8\u05d5\u05d0\u05e8", "\u05de\u05e8\u05e5", "\u05d0\u05e4\u05e8\u05d9\u05dc", "\u05de\u05d0\u05d9", "\u05d9\u05d5\u05e0\u05d9",
        "\u05d9\u05d5\u05dc\u05d9", "\u05d0\u05d5\u05d2\u05d5\u05e1\u05d8", "\u05e1\u05e4\u05d8\u05de\u05d1\u05e8", "\u05d0\u05d5\u05e7\u05d8\u05d5\u05d1\u05e8", "\u05e0\u05d5\u05d1\u05de\u05d1\u05e8", "\u05d3\u05e6\u05de\u05d1\u05e8"
    ];

    var MONTHS_HE = MONTHS_HE_FULL.map(function(n) { return n.substring(0, 3); });

    var DAYS_HE = ["\u05d0", "\u05d1", "\u05d2", "\u05d3", "\u05d4", "\u05d5", "\u05e9"];

    var WEEKDAYS_FULL = [
        "\u05d9\u05d5\u05dd \u05e8\u05d0\u05e9\u05d5\u05df", "\u05d9\u05d5\u05dd \u05e9\u05e0\u05d9", "\u05d9\u05d5\u05dd \u05e9\u05dc\u05d9\u05e9\u05d9", "\u05d9\u05d5\u05dd \u05e8\u05d1\u05d9\u05e2\u05d9",
        "\u05d9\u05d5\u05dd \u05d7\u05de\u05d9\u05e9\u05d9", "\u05d9\u05d5\u05dd \u05e9\u05d9\u05e9\u05d9", "\u05e9\u05d1\u05ea"
    ];

    var TOTAL_COLS = 37;

    var currentYear = 2026;
    var calendarData = {};
    var currentEditKey = null;
    var currentEditMonth = null;
    var currentEditDay = null;
    var currentType = "general";

    function dataKey(month, day) { return month + "-" + day; }

    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }

    function getFirstDayOfWeek(year, month) {
        return new Date(year, month, 1).getDay();
    }

    function isToday(year, month, day) {
        var now = new Date();
        return now.getFullYear() === year && now.getMonth() === month && now.getDate() === day;
    }

    async function loadData(year) {
        var result = {};
        var { data } = await sb
            .from("calendar_entries")
            .select("id, month, day, content, type, hidden")
            .eq("year", year);

        if (data) {
            data.forEach(function(row) {
                var key = dataKey(row.month, row.day);
                if (!result[key]) result[key] = [];
                result[key].push({
                    id: row.id,
                    type: row.type || "general",
                    content: row.content,
                    hidden: row.hidden || false
                });
            });
        }
        return result;
    }

    async function insertEntryToDB(year, month, day, content, type) {
        var { data } = await sb.from("calendar_entries").insert({
            year: year, month: month, day: day,
            content: content, type: type,
            updated_at: new Date().toISOString()
        }).select("id");
        return data && data[0] ? data[0].id : null;
    }

    async function updateEntryInDB(id, content, type) {
        await sb.from("calendar_entries")
            .update({ content: content, type: type, updated_at: new Date().toISOString() })
            .eq("id", id);
    }

    async function deleteEntryByIdFromDB(id) {
        await sb.from("calendar_entries").delete().eq("id", id);
    }

    async function toggleHolidayInDB(id, hidden) {
        await sb.from("calendar_entries")
            .update({ hidden: hidden })
            .eq("id", id);
    }

    async function loadNotesFromDB(year) {
        var { data } = await sb.from("calendar_notes")
            .select("note_type, content")
            .eq("year", year);
        var notes = {};
        if (data) data.forEach(function(r) { notes[r.note_type] = r.content; });
        return notes;
    }

    async function saveNoteToDB(year, noteType, content) {
        await sb.from("calendar_notes").upsert({
            year: year,
            note_type: noteType,
            content: content,
            updated_at: new Date().toISOString()
        }, { onConflict: "year,note_type" });
    }

    function buildYearSelector() {
        var select = document.getElementById("yearSelect");
        for (var y = 2024; y <= 2035; y++) {
            var opt = document.createElement("option");
            opt.value = y;
            opt.textContent = y;
            if (y === currentYear) opt.selected = true;
            select.appendChild(opt);
        }
        select.addEventListener("change", async function() {
            currentYear = parseInt(select.value);
            calendarData = await loadData(currentYear);
            renderCalendar();
            await loadBottomSections();
        });
    }

    function renderCalendar() {
        var grid = document.getElementById("calendar");
        grid.innerHTML = "";

        var corner = document.createElement("div");
        corner.className = "corner-cell";
        grid.appendChild(corner);

        for (var i = 0; i < TOTAL_COLS; i++) {
            var hdr = document.createElement("div");
            hdr.className = "day-header";
            hdr.textContent = DAYS_HE[i % 7];
            if (i % 7 === 6) hdr.classList.add("shabbat");
            if (i % 7 === 5) hdr.classList.add("friday");
            if (i > 0 && i % 7 === 0) hdr.classList.add("week-sep");
            grid.appendChild(hdr);
        }

        for (var m = 0; m < 12; m++) {
            var isOdd = m % 2 === 1;
            var firstDay = getFirstDayOfWeek(currentYear, m);
            var days = getDaysInMonth(currentYear, m);

            var label = document.createElement("div");
            label.className = "month-label";
            if (isOdd) label.classList.add("month-row-odd");
            label.textContent = MONTHS_HE[m];
            grid.appendChild(label);

            for (var col = 0; col < TOTAL_COLS; col++) {
                var dayNum = col - firstDay + 1;
                var cell = document.createElement("div");
                var weekday = col % 7;

                if (col > 0 && col % 7 === 0) cell.classList.add("week-sep");

                if (dayNum >= 1 && dayNum <= days) {
                    cell.className = "day-cell";
                    if (isOdd) cell.classList.add("month-row-odd");
                    if (weekday === 5 || weekday === 6) cell.classList.add("weekend");

                    var dateRow = document.createElement("div");
                    dateRow.className = "date-row";

                    var key = dataKey(m, dayNum);
                    var entries = calendarData[key] || [];

                    var numSpan = document.createElement("span");
                    numSpan.textContent = dayNum;
                    dateRow.appendChild(numSpan);

                    var hasHoliday = entries.some(function(e) { return e.type === "holiday"; });
                    var hasHolidayAny = entries.some(function(e) { return e.type === "holiday"; });
                    var hasGeneral = entries.some(function(e) { return e.type === "general"; });
                    var hasVacation = entries.some(function(e) { return e.type === "vacation"; });

                    if (hasVacation) cell.classList.add("vacation-cell");
                    if (hasHolidayAny && weekday !== 5 && weekday !== 6) cell.classList.add("holiday-cell");

                    var typesShown = {};
                    entries.forEach(function(e) {
                        if (!typesShown[e.type]) {
                            typesShown[e.type] = true;
                            var dot = document.createElement("div");
                            dot.className = "type-dot type-" + e.type;
                            dateRow.appendChild(dot);
                        }
                    });

                    cell.appendChild(dateRow);

                    if (entries.length > 0) {
                        cell.dataset.key = key;
                        var tipParts = [];
                        entries.forEach(function(e) {
                            if (e.hidden) return;
                            var p = document.createElement("div");
                            p.className = "content-preview" + (e.type === "holiday" ? " holiday-preview" : "");
                            p.textContent = e.content;
                            cell.appendChild(p);
                            tipParts.push(e.content);
                        });
                        if (tipParts.length > 0) cell.dataset.tip = tipParts.join(" | ");
                    }

                    if (isToday(currentYear, m, dayNum)) {
                        cell.classList.add("today");
                    }

                    (function(mm, dd) {
                        cell.addEventListener("click", function() { openEditor(mm, dd); });
                    })(m, dayNum);
                } else {
                    cell.className = "empty-cell";
                    if (isOdd) cell.classList.add("month-row-odd");
                }

                grid.appendChild(cell);
            }
        }

        requestAnimationFrame(trimPreviews);
    }

    function trimPreviews() {
        document.querySelectorAll(".content-preview").forEach(function(el) {
            var original = el.dataset.full || el.textContent;
            el.dataset.full = original;
            el.textContent = original;
            if (el.scrollWidth <= el.clientWidth) return;
            var lo = 0, hi = original.length;
            while (lo < hi) {
                var mid = Math.ceil((lo + hi) / 2);
                el.textContent = original.slice(0, mid);
                if (el.scrollWidth > el.clientWidth) {
                    hi = mid - 1;
                } else {
                    lo = mid;
                }
            }
            el.textContent = original.slice(0, lo);
        });
    }

    var dpStartDate = null;
    var dpEndDate = null;
    var dpDefaultDate = null;
    var dpViewMonth = null;
    var dpViewYear = null;

    function getHolidayBase(text) {
        var s = text.replace(/\s*\(חוה"מ\)/, "").trim();
        s = s.replace(/\s+(א|ב|ג|ד|ה|ו|ז|ח)$/, "").trim();
        s = s.replace(/^ערב\s+/, "").trim();
        return s;
    }

    function findHolidayDateRange(holidayText) {
        var base = getHolidayBase(holidayText);
        var startMonth = null, startDay = null, endMonth = null, endDay = null;
        for (var m = 0; m < 12; m++) {
            for (var d = 1; d <= getDaysInMonth(currentYear, m); d++) {
                var k = dataKey(m, d);
                var arr = calendarData[k] || [];
                var holiday = arr.find(function(e) { return e.type === "holiday"; });
                if (holiday && getHolidayBase(holiday.content) === base) {
                    if (startDay === null) { startMonth = m; startDay = d; }
                    endMonth = m; endDay = d;
                }
            }
        }
        if (startDay === null) return "";
        var sd = String(startDay).padStart(2, "0") + "." + String(startMonth + 1).padStart(2, "0");
        var ed = String(endDay).padStart(2, "0") + "." + String(endMonth + 1).padStart(2, "0");
        if (sd === ed) return sd;
        return sd + " - " + ed;
    }

    var TYPE_LABELS = { holiday: "חג", general: "אירוע", vacation: "חופש" };
    var TYPE_COLORS = { holiday: "#FF8400", general: "#FFDD28", vacation: "#35E494" };

    function openEditor(month, day) {
        var key = dataKey(month, day);
        currentEditKey = key;
        currentEditMonth = month;
        currentEditDay = day;

        var dow = new Date(currentYear, month, day).getDay();
        var dd = String(day).padStart(2, "0");
        var mm = String(month + 1).padStart(2, "0");

        document.getElementById("modalTitle").textContent =
            dd + "." + mm + "  " + WEEKDAYS_FULL[dow];

        dpStartDate = new Date(currentYear, month, day);
        dpEndDate = new Date(currentYear, month, day);
        dpDefaultDate = new Date(currentYear, month, day);
        dpViewMonth = month;
        dpViewYear = currentYear;

        document.getElementById("newEntryForm").classList.remove("visible");
        document.getElementById("addEntryBtn").style.display = "";
        document.getElementById("datePicker").classList.remove("active");

        renderEntriesList();
        document.getElementById("modalOverlay").classList.add("active");
    }

    function renderEntriesList() {
        var list = document.getElementById("entriesList");
        var entries = calendarData[currentEditKey] || [];
        var html = "";

        entries.forEach(function(entry) {
            var tagClass = "tag-" + entry.type;
            var isHoliday = entry.type === "holiday";

            html += '<div class="entry-card" data-entry-id="' + entry.id + '">';
            html += '<div class="entry-card-header">';
            html += '<span class="entry-type-tag ' + tagClass + '"><span class="tag-dot"></span>' + TYPE_LABELS[entry.type] + '</span>';
            if (isHoliday) {
                html += '<span style="font-size:12px;color:#666;">' + findHolidayDateRange(entry.content) + '</span>';
            }
            if (!isHoliday) {
                html += '<div class="entry-actions">';
                html += '<button class="entry-action-btn edit-entry-btn" data-id="' + entry.id + '" title="ערוך"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
                html += '<button class="entry-action-btn delete-entry-btn" data-id="' + entry.id + '" title="מחק"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>';
                html += '</div>';
            }
            html += '</div>';

            if (isHoliday) {
                html += '<div class="entry-content">' + entry.content + '</div>';
                html += '<div class="holiday-toggle-row">';
                html += '<label class="toggle-switch"><input type="checkbox" class="holiday-toggle-cb" data-id="' + entry.id + '"' + (entry.hidden ? '' : ' checked') + '><span class="toggle-slider"></span></label>';
                html += '<span class="holiday-toggle-label">הצגה בלוח</span>';
                html += '</div>';
            } else {
                html += '<div class="entry-content">' + entry.content + '</div>';
            }

            html += '</div>';
        });

        if (entries.length === 0) {
            html = '<div style="text-align:center;padding:30px 0;color:#aaa;font-size:14px;">אין תוכן עדיין</div>';
        }

        list.innerHTML = html;

        list.querySelectorAll(".edit-entry-btn").forEach(function(btn) {
            btn.addEventListener("click", function() { startEditEntry(parseInt(btn.dataset.id)); });
        });

        list.querySelectorAll(".delete-entry-btn").forEach(function(btn) {
            btn.addEventListener("click", function() { deleteEntryById(parseInt(btn.dataset.id)); });
        });

        list.querySelectorAll(".holiday-toggle-cb").forEach(function(cb) {
            cb.addEventListener("change", function() {
                toggleHoliday(parseInt(cb.dataset.id), !cb.checked);
            });
        });
    }

    function startEditEntry(entryId) {
        var entries = calendarData[currentEditKey] || [];
        var entry = entries.find(function(e) { return e.id === entryId; });
        if (!entry) return;

        var card = document.querySelector('.entry-card[data-entry-id="' + entryId + '"]');
        if (!card) return;

        var editType = entry.type;
        var editHtml = '<div class="edit-entry-form">';
        editHtml += '<div class="type-selector">';
        editHtml += '<button class="type-option' + (editType === "general" ? " active" : "") + '" data-type="general">אירוע</button>';
        editHtml += '<button class="type-option' + (editType === "vacation" ? " active" : "") + '" data-type="vacation">חופש</button>';
        editHtml += '</div>';
        editHtml += '<textarea>' + entry.content + '</textarea>';
        editHtml += '<div class="form-actions">';
        editHtml += '<button class="form-btn form-btn-save">שמור</button>';
        editHtml += '<button class="form-btn form-btn-cancel">ביטול</button>';
        editHtml += '</div></div>';

        card.innerHTML = editHtml;

        card.querySelectorAll(".type-option").forEach(function(opt) {
            opt.addEventListener("click", function() {
                card.querySelectorAll(".type-option").forEach(function(o) { o.classList.remove("active"); });
                opt.classList.add("active");
                editType = opt.dataset.type;
            });
        });

        card.querySelector(".form-btn-save").addEventListener("click", async function() {
            var newText = card.querySelector("textarea").value.trim();
            if (!newText) return;
            entry.content = newText;
            entry.type = editType;
            await updateEntryInDB(entryId, newText, editType);
            renderEntriesList();
            renderCalendar();
        });

        card.querySelector(".form-btn-cancel").addEventListener("click", function() {
            renderEntriesList();
        });

        card.querySelector("textarea").focus();
    }

    async function deleteEntryById(entryId) {
        var entries = calendarData[currentEditKey] || [];
        calendarData[currentEditKey] = entries.filter(function(e) { return e.id !== entryId; });
        if (calendarData[currentEditKey].length === 0) delete calendarData[currentEditKey];
        await deleteEntryByIdFromDB(entryId);
        renderEntriesList();
        renderCalendar();
    }

    async function toggleHoliday(entryId, hidden) {
        var entries = calendarData[currentEditKey] || [];
        var entry = entries.find(function(e) { return e.id === entryId; });
        if (!entry) return;
        entry.hidden = hidden;
        await toggleHolidayInDB(entryId, hidden);
        renderCalendar();
    }

    var newEntryType = "general";
    document.getElementById("addEntryBtn").addEventListener("click", function() {
        document.getElementById("newEntryForm").classList.add("visible");
        document.getElementById("addEntryBtn").style.display = "none";
        document.getElementById("newEntryText").value = "";
        newEntryType = "general";
        document.querySelectorAll("#newTypeSelector .type-option").forEach(function(o) {
            o.classList.toggle("active", o.dataset.type === "general");
        });
        setTimeout(function() { document.getElementById("newEntryText").focus(); }, 50);
    });

    document.querySelectorAll("#newTypeSelector .type-option").forEach(function(opt) {
        opt.addEventListener("click", function() {
            document.querySelectorAll("#newTypeSelector .type-option").forEach(function(o) { o.classList.remove("active"); });
            opt.classList.add("active");
            newEntryType = opt.dataset.type;
        });
    });

    document.getElementById("newEntrySave").addEventListener("click", async function() {
        var text = document.getElementById("newEntryText").value.trim();
        if (!text) return;

        var hasRange = dpStartDate && dpEndDate && dpStartDate.getTime() !== dpEndDate.getTime();

        if (hasRange) {
            var d = new Date(dpStartDate);
            while (d <= dpEndDate) {
                var m = d.getMonth();
                var dd = d.getDate();
                var key = dataKey(m, dd);
                if (!calendarData[key]) calendarData[key] = [];
                var newId = await insertEntryToDB(currentYear, m, dd, text, newEntryType);
                calendarData[key].push({ id: newId, type: newEntryType, content: text, hidden: false });
                d.setDate(d.getDate() + 1);
            }
        } else {
            if (!calendarData[currentEditKey]) calendarData[currentEditKey] = [];
            var newId = await insertEntryToDB(currentYear, currentEditMonth, currentEditDay, text, newEntryType);
            calendarData[currentEditKey].push({ id: newId, type: newEntryType, content: text, hidden: false });
        }

        document.getElementById("newEntryForm").classList.remove("visible");
        document.getElementById("addEntryBtn").style.display = "";
        dpStartDate = dpDefaultDate;
        dpEndDate = dpDefaultDate;
        renderEntriesList();
        renderCalendar();
    });

    document.getElementById("newEntryCancel").addEventListener("click", function() {
        document.getElementById("newEntryForm").classList.remove("visible");
        document.getElementById("addEntryBtn").style.display = "";
    });

    function renderDatePicker() {
        var dp = document.getElementById("datePicker");
        var m1 = dpViewMonth;
        var y1 = dpViewYear;
        var m2 = m1 + 1;
        var y2 = y1;
        if (m2 > 11) { m2 = 0; y2 = y1 + 1; }

        var html = '<button class="dp-close-btn" id="dpCloseBtn">&times;</button>';
        html += '<div class="dp-months">';
        html += renderDPMonth(y1, m1);
        html += renderDPMonth(y2, m2);
        html += '</div>';
        dp.innerHTML = html;

        dp.querySelector("#dpCloseBtn").addEventListener("click", function() {
            dp.classList.remove("active");
        });

        dp.querySelectorAll(".dp-day:not(.empty)").forEach(function(dayEl) {
            dayEl.addEventListener("click", function() {
                var d = new Date(parseInt(dayEl.dataset.year), parseInt(dayEl.dataset.month), parseInt(dayEl.dataset.day));
                if (dpDefaultDate && d.getTime() === dpDefaultDate.getTime()) {
                    dpStartDate = dpDefaultDate;
                    dpEndDate = dpDefaultDate;
                    renderDatePicker();
                    return;
                }
                if (d <= dpDefaultDate) return;
                dpStartDate = dpDefaultDate;
                dpEndDate = d;
                renderDatePicker();
            });
        });
    }

    function renderDPMonth(year, month) {
        var days = getDaysInMonth(year, month);
        var firstDay = getFirstDayOfWeek(year, month);
        var html = '<div class="dp-month">';
        html += '<div class="dp-month-title">' + MONTHS_HE_FULL[month] + ' ' + year + '</div>';
        html += '<div class="dp-weekdays">';
        DAYS_HE.forEach(function(d) { html += '<span>' + d + '</span>'; });
        html += '</div>';
        html += '<div class="dp-days">';
        for (var i = 0; i < firstDay; i++) html += '<div class="dp-day empty"></div>';
        for (var d = 1; d <= days; d++) {
            var date = new Date(year, month, d);
            var isDefault = dpDefaultDate && date.getTime() === dpDefaultDate.getTime();
            var isStart = dpStartDate && date.getTime() === dpStartDate.getTime();
            var isEnd = dpEndDate && date.getTime() === dpEndDate.getTime();
            var isInRange = dpStartDate && dpEndDate && date > dpStartDate && date < dpEndDate;
            var hasRange = dpStartDate && dpEndDate && dpStartDate.getTime() !== dpEndDate.getTime();

            var cls = "dp-day";
            if (isDefault && !hasRange) {
                cls += " default-day";
            } else if (isDefault && hasRange) {
                cls += " default-day has-range";
            } else if (isEnd && hasRange) {
                cls += " range-end has-range";
            } else if (isInRange) {
                cls += " in-range";
            }
            html += '<div class="' + cls + '" data-year="' + year + '" data-month="' + month + '" data-day="' + d + '">' + d + '</div>';
        }
        html += '</div></div>';
        return html;
    }

    function closeEditor() {
        document.getElementById("modalOverlay").classList.remove("active");
        currentEditKey = null;
    }

    async function loadBottomSections() {
        var notes = await loadNotesFromDB(currentYear);
        document.getElementById("yearlyPlan").value = notes["plan"] || "";
        document.getElementById("yearlyGoals").value = notes["goals"] || "";
    }

    var noteTimer = null;
    function setupBottomSections() {
        document.getElementById("yearlyPlan").addEventListener("input", function(e) {
            clearTimeout(noteTimer);
            noteTimer = setTimeout(function() { saveNoteToDB(currentYear, "plan", e.target.value); }, 500);
        });
        document.getElementById("yearlyGoals").addEventListener("input", function(e) {
            clearTimeout(noteTimer);
            noteTimer = setTimeout(function() { saveNoteToDB(currentYear, "goals", e.target.value); }, 500);
        });
    }

    document.getElementById("btnCancel").addEventListener("click", closeEditor);
    document.getElementById("btnClose").addEventListener("click", closeEditor);

    document.getElementById("modalOverlay").addEventListener("click", function(e) {
        if (e.target === e.currentTarget) closeEditor();
    });

    document.addEventListener("keydown", function(e) {
        if (!document.getElementById("modalOverlay").classList.contains("active")) return;
        if (e.key === "Escape") closeEditor();
    });

    var tooltip = document.getElementById("cellTooltip");
    document.getElementById("calendar").addEventListener("mouseover", function(e) {
        var cell = e.target.closest(".day-cell");
        if (!cell || !cell.dataset.tip) { tooltip.classList.remove("active"); return; }

        var rect = cell.getBoundingClientRect();
        var ratio = rect.width / rect.height;
        var ttH = 140;
        var ttW = Math.round(ttH * ratio);
        tooltip.style.width = ttW + "px";
        tooltip.style.height = ttH + "px";

        var html = '';
        var dateText = cell.querySelector(".date-row span") ? cell.querySelector(".date-row span").textContent : "";
        html += '<div class="tt-date">' + dateText + '</div>';

        var entries = calendarData[cell.dataset.key] || [];
        entries.forEach(function(entry) {
            if (entry.hidden) return;
            var dotColor = TYPE_COLORS[entry.type] || "#FFDD28";
            var textClass = entry.type === "holiday" ? "tt-holiday" : "tt-content";
            html += '<div class="tt-line"><div class="tt-line-dot" style="background:' + dotColor + '"></div><div class="' + textClass + '">' + entry.content + '</div></div>';
        });

        tooltip.innerHTML = html;
        tooltip.classList.add("active");
        tooltip.style.top = (rect.top - ttH - 6) + "px";
        tooltip.style.left = (rect.left + rect.width / 2 - ttW / 2) + "px";
    });
    document.getElementById("calendar").addEventListener("mouseout", function(e) {
        var cell = e.target.closest(".day-cell");
        if (cell) tooltip.classList.remove("active");
    });

    buildYearSelector();
    setupBottomSections();

    (async function() {
        calendarData = await loadData(currentYear);
        renderCalendar();
        await loadBottomSections();
    })();
</script>

</body>
</html>
