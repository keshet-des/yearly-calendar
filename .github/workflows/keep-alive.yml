name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://agshutiyyoebbgtsjyfh.supabase.co/rest/v1/calendar_entries?limit=1&select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
